<style>

const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", hash:"SHA-256", salt:unb64(BLOB.salt), iterations:BLOB.iter},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(BLOB.iv)}, key, unb64(BLOB.ct));
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
const msg = document.getElementById("msg"), go = document.getElementById("go");
function store(v){ try{ if(v === undefined) return localStorage.getItem("vanTripPw"); localStorage.setItem("vanTripPw", v); }catch(e){ return null; } }
async function tryOpen(pw, remember){
  go.disabled = true; msg.textContent = ""; go.textContent = "解密中…";
  try{
    const html = await unlock(pw);
    if(remember) store(pw);
    show(html);
  }catch(e){
    go.disabled = false; go.textContent = "打開行程";
    if(remember) msg.textContent = "密碼不對，請再試一次。";
    else try{ localStorage.removeItem("vanTripPw"); }catch(_){}  // 密碼已更換：清掉舊的，改手動輸入
    document.getElementById("pw").select();
  }
}
if(!window.crypto || !crypto.subtle){
  msg.textContent = "這個瀏覽器無法解密，請改用 Chrome 或 Safari 開啟網址。";
  go.disabled = true;
}else{
  document.getElementById("f").addEventListener("submit", e => { e.preventDefault(); tryOpen(document.getElementById("pw").value, true); });
  const saved = store();
  if(saved) tryOpen(saved, false);
  else document.getElementById("pw").focus();
}
</script>
